<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PitBot · KSAE Q&A</title>
  <script src="/static/bypass.js"></script>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- 나이스페이 결제창. AUTHNICE.requestPay() 가 여기서 온다. -->
  <script src="https://pay.nicepay.co.kr/v1/js/"></script>
  <script>
    (function() {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>
</head>
<body class="chat-page">
  <a class="skip-link" href="#chat">대화 내용으로 건너뛰기</a>
  <div class="app-layout">
    <header>
      <div class="header-top">
        <div class="header-leading">
          <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="대화 목록 열기">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <a href="/" class="header-brand">
            <img src="/static/logo.svg" alt="" class="header-logo">
            <h1>PitBot</h1>
          </a>
        </div>
        <div class="header-actions">
          <div id="auth-area"></div>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환"></button>
        </div>
      </div>
    </header>

    <div class="content-area">
      <aside id="sidebar" class="sidebar" aria-label="대화 목록">
        <button id="new-chat-btn" class="new-chat-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          새 대화
        </button>
        <nav id="session-list" class="session-list" aria-label="저장된 대화"></nav>
      </aside>
      <div id="sidebar-overlay" class="sidebar-overlay"></div>

      <div class="main">
        <div class="chat-wrapper">
          <div id="chat" class="chat"></div>
        </div>

        <form id="form" class="input-area">
          <!-- 소스 칩·필터는 /api/collections 응답으로 렌더된다. -->
          <div class="control-bar">
            <div class="control-group source-group">
              <span class="control-label">검색 소스</span>
              <div id="collection-chips" class="collection-selector"></div>
            </div>
          </div>
          <div class="input-row">
            <input
              id="query"
              type="text"
              maxlength="2000"
              placeholder="질문을 입력하세요..."
              autocomplete="off"
              required
            >
            <button type="submit" id="send" aria-label="질문 보내기">
              <span>전송</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-5-7-2Z"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- 전자상거래법 제10조 표시사항. 값은 /api/policy 에서 채운다. -->
    <footer id="site-footer" class="site-footer">
      <div id="footer-business" class="footer-business"></div>
      <div class="footer-links">
        <a href="/policy">이용약관</a>
        <a href="/policy#privacy">개인정보처리방침</a>
        <a href="/policy#refund">취소·환불규정</a>
      </div>
    </footer>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
