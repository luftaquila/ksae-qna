<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>PitBot · KSAE 질문 작업대</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
  <link rel="stylesheet" href="/static/styles/tokens.css">
  <link rel="stylesheet" href="/static/styles/base.css">
  <link rel="stylesheet" href="/static/styles/chat.css">
  <script>
    (() => {
      const saved = localStorage.getItem("theme");
      const theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body class="chat-page">
  <a class="skip-link" href="#chat-main">대화 영역으로 건너뛰기</a>

  <div class="app-frame">
    <header class="topbar">
      <div class="topbar__leading">
        <button id="sidebar-toggle" class="icon-button topbar__menu" type="button" aria-label="대화 목록 열기" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <a href="/" class="brand" aria-label="PitBot 홈">
          <span class="brand__mark" aria-hidden="true"></span>
          <span>
            <span class="brand__name">PitBot</span>
            <span class="brand__descriptor">KSAE knowledge workbench</span>
          </span>
        </a>
      </div>

      <div class="topbar__trailing">
        <div id="auth-area" class="auth-area" aria-live="polite">
          <span class="auth-skeleton skeleton" aria-label="사용자 정보 불러오는 중"></span>
        </div>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 테마로 전환">
          <svg class="icon theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/>
          </svg>
          <svg class="icon theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="workbench-shell">
      <aside id="sidebar" class="session-rail" aria-label="대화 목록" aria-hidden="true">
        <div class="session-rail__head">
          <p class="rail-label">Conversations</p>
          <button id="new-chat-btn" class="button button--accent new-chat" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            새 대화
          </button>
        </div>
        <nav id="session-list" class="session-list" aria-label="저장된 대화"></nav>
        <div class="session-rail__foot">
          <span class="status-dot" aria-hidden="true"></span>
          <span>사용자 질문에만 모델 호출</span>
        </div>
      </aside>
      <button id="sidebar-overlay" class="sidebar-overlay" type="button" aria-label="대화 목록 닫기" tabindex="-1"></button>

      <main id="chat-main" class="chat-workbench">
        <section class="conversation-plane" aria-labelledby="conversation-title">
          <header class="conversation-head">
            <div>
              <p class="rail-label">Active channel</p>
              <h1 id="conversation-title">KSAE 질의 로그</h1>
            </div>
            <div id="conversation-status" class="conversation-status" aria-live="polite">
              <span class="status-dot" aria-hidden="true"></span>
              <span>대기</span>
            </div>
          </header>

          <div class="chat-scroll">
            <div id="chat" class="chat-log" role="log" aria-live="polite" aria-relevant="additions text" aria-busy="false"></div>
          </div>
        </section>

        <form id="form" class="composer">
          <div class="composer__spec">
            <label class="model-control" for="model-select">
              <span class="control-label">Model</span>
              <select id="model-select" aria-describedby="composer-status"></select>
            </label>
            <button id="filter-open" class="filter-trigger" type="button" aria-label="검색 근거 설정" aria-haspopup="dialog" aria-controls="filter-dialog">
              <span>
                <span class="control-label">Evidence</span>
                <span id="filter-summary" class="filter-summary">검색 소스 불러오는 중</span>
              </span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
            </button>
          </div>

          <div class="composer__input">
            <label class="visually-hidden" for="query">질문</label>
            <textarea id="query" rows="1" maxlength="2000" placeholder="규정이나 현장 Q&A를 질문하세요" autocomplete="off" required></textarea>
            <button id="send" class="button composer__send" type="submit">
              <span class="send-label">질문 보내기</span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-5-7-2Z"/></svg>
            </button>
          </div>
          <div class="composer__meta">
            <span id="composer-status" aria-live="polite">Enter 전송 · Shift+Enter 줄바꿈</span>
            <span id="query-count" aria-hidden="true">0 / 2,000</span>
          </div>
        </form>
      </main>
    </div>
  </div>

  <dialog id="filter-dialog" aria-labelledby="filter-title">
    <div class="dialog__header">
      <div>
        <p class="rail-label">Retrieval scope</p>
        <h2 id="filter-title" class="dialog__title">검색 근거 설정</h2>
      </div>
      <button id="filter-close" class="icon-button" type="button" aria-label="검색 근거 설정 닫기">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="dialog__body">
      <p class="filter-intro">선택한 자료만 검색합니다. 현장 Q&A의 신뢰도와 카테고리 필터도 여기서 조정할 수 있습니다.</p>
      <fieldset class="filter-fieldset">
        <legend>검색 소스</legend>
        <div id="collection-chips" class="collection-selector"></div>
      </fieldset>
    </div>
    <div class="dialog__footer">
      <button id="filter-apply" class="button" type="button">설정 적용</button>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/static/js/chat.js"></script>
</body>
</html>
