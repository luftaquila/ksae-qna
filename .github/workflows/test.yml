name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  ui-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI regression tests
        run: >-
          npx playwright test tests/ui/chat.spec.js
          --grep "collection chips keep their width when toggled|AARK always searches every confidence level|source selector exposes only broad source groups|source selector always keeps at least one source enabled|chat payload leaves competition and Q&A routing to the server|chat keeps the original welcome copy|mobile welcome notice is not clipped|chat does not overflow"
